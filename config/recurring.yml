# Return reminders (ADR 0009). The schedule is in the library's time zone.
send_return_reminders: &send_return_reminders
  class: Lending::SendRemindersJob
  schedule: every day at 8am Europe/Warsaw

development:
  send_return_reminders: *send_return_reminders

production:
  send_return_reminders: *send_return_reminders
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
